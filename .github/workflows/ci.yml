name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install quality dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile source
        run: python -m compileall -q src scripts tests

      - name: Lint
        run: ruff check .

      - name: CLI smoke checks
        run: |
          python -m src.detect --help > /dev/null
          python -m src.track --help > /dev/null
          python -m src.pipeline --help > /dev/null
          python scripts/benchmark.py --help > /dev/null

      - name: Unit tests
        run: python -m pytest -q
